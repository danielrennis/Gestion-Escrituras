<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador de Mapa - Rennis</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: white; display: flex; height: 100vh; overflow: hidden; }
        #map { flex-grow: 1; height: 100vh; cursor: crosshair; }
        .sidebar {
            width: 380px;
            background: #111;
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow-y: auto;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #4ade80; border-bottom: 1px solid #333; padding-bottom: 10px; }
        p.instr { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; margin-bottom: 20px; }
        
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #e2e8f0; }
        select { 
            width: 100%; 
            padding: 10px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: white; 
            border-radius: 6px; 
            font-size: 0.9rem;
            outline: none;
        }
        
        .prop-list { flex-grow: 1; margin-top: 10px; }
        .prop-item { 
            background: #1e293b; 
            margin-bottom: 10px; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prop-item.set { border-left: 4px solid #4ade80; }
        .prop-info { display: flex; flex-direction: column; }
        .prop-name { font-size: 0.9rem; font-weight: bold; }
        .prop-coords { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; font-family: monospace; }
        
        button {
            background: #4ade80;
            color: #0f172a;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #22c55e; }
        
        .coord-output {
            margin-top: 15px;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #4ade80;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="sidebar">
        <h2>📍 Ubicar Propiedades</h2>
        <p class="instr">1. Seleccioná una propiedad de la lista.<br>2. Hacé clic en el lugar exacto del mapa.<br>3. Repetí con las demás y copiá las coordenadas.</p>
        
        <div class="control-group">
            <label for="propSelect">Propiedad Activa:</label>
            <select id="propSelect">
                <option value="Machagai - Alberdi">Machagai - Alberdi</option>
                <option value="Machagai - Carlitos">Machagai - Carlitos</option>
                <option value="Machagai - Farmacia">Machagai - Farmacia</option>
                <option value="Machagai - Donacion Benchu">Machagai - Donacion Benchu</option>
                <option value="Machagai - Donacion Angel la Gata">Machagai - Donacion Angel la Gata</option>
                <option value="Machagai - Encina">Machagai - Encina</option>
                <option value="Machagai - Ruta 16 - Chacra 30">Machagai - Ruta 16 - Chacra 30</option>
                <option value="Colonia Popular - Chacra 95">Colonia Popular - Chacra 95</option>
                <option value="Resistencia - Domicilio Principal">Resistencia - Domicilio Principal</option>
                <option value="Resistencia - La California">Resistencia - La California</option>
            </select>
        </div>

        <div class="prop-list" id="propList">
            <!-- Items generados por JS -->
        </div>

        <button onclick="generarTexto()">Copiar YAML para Obsidian</button>
        <div class="coord-output" id="output"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa
        var map = L.map('map', { zoomControl: false }).setView([-26.926, -60.040], 14); // Centrado en Machagai
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // Capa de Google Maps Satélite (Alta resolución y zoom profundo)
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            attribution: 'Map data &copy; Google',
            maxNativeZoom: 20, // Máximo zoom real disponible
            maxZoom: 22        // Permite "estirar" la imagen un poco más para ver de cerca
        }).addTo(map);

        const propiedades = [
            "Machagai - Alberdi", "Machagai - Carlitos", "Machagai - Farmacia", 
            "Machagai - Donacion Benchu", "Machagai - Donacion Angel la Gata", 
            "Machagai - Encina", "Machagai - Ruta 16 - Chacra 30", 
            "Colonia Popular - Chacra 95", "Resistencia - Domicilio Principal", "Resistencia - La California"
        ];

        const markers = {};
        const state = {};

        // Generar lista UI
        const listEl = document.getElementById('propList');
        propiedades.forEach(p => {
            state[p] = null;
            listEl.innerHTML += `
                <div class="prop-item" id="item-${p.replace(/\s+/g, '-')}">
                    <div class="prop-info">
                        <span class="prop-name">${p}</span>
                        <span class="prop-coords" id="coord-${p.replace(/\s+/g, '-')}">Sin ubicación</span>
                    </div>
                </div>
            `;
        });

        const selectEl = document.getElementById('propSelect');

        // Evento de clic en mapa
        map.on('click', function(e) {
            const prop = selectEl.value;
            const lat = e.latlng.lat.toFixed(5);
            const lng = e.latlng.lng.toFixed(5);
            
            // Si ya hay marcador, lo movemos; si no, lo creamos
            if (markers[prop]) {
                markers[prop].setLatLng(e.latlng);
            } else {
                markers[prop] = L.marker(e.latlng).addTo(map).bindPopup("<b>" + prop + "</b>");
            }
            
            markers[prop].openPopup();
            state[prop] = `${lat}, ${lng}`;
            
            // Actualizar UI
            const itemId = prop.replace(/\s+/g, '-');
            document.getElementById('item-' + itemId).classList.add('set');
            document.getElementById('coord-' + itemId).innerText = `${lat}, ${lng}`;
            
            // Avanzar al siguiente en el select si no es el último
            if (selectEl.selectedIndex < selectEl.options.length - 1) {
                selectEl.selectedIndex++;
            }
        });

        function generarTexto() {
            let outputText = "";
            for (const [prop, coords] of Object.entries(state)) {
                if (coords) {
                    outputText += `${prop}:\ncoordenadas: "${coords}"\n\n`;
                }
            }
            if (outputText === "") outputText = "No marcaste ninguna propiedad aún.";
            
            const outDiv = document.getElementById('output');
            outDiv.innerText = outputText;
            outDiv.style.display = "block";
            
            navigator.clipboard.writeText(outputText).then(() => {
                alert("Coordenadas copiadas al portapapeles. Podes pegarlas en mi chat o en Obsidian.");
            });
        }
    </script>
</body>
</html>
